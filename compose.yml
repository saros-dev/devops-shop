services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
      POSTGRES_DB: devops_shop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: devops-shop:local
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://devops:devops@postgres:5432/devops_shop
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: