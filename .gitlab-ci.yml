stages:
  - test
  - build
  - docker

go-test:
  stage: test
  image: golang:1.27
  tags:
    - docker
  script:
    - go version
    - go mod download
    - go test ./...

go-build:
  stage: build
  image: golang:1.27
  tags:
    - docker
  script:
    - go mod download
    - go build -o devops-shop ./cmd/api
  artifacts:
    paths:
      - devops-shop

docker-build:
  stage: docker
  image:
    name: docker:cli
    pull_policy: if-not-present
  tags:
    - docker
  services:
    - name: docker:dind
      pull_policy: if-not-present
      command:
        - "--insecure-registry=192.168.64.14:5050"
        - "--ipv6=false"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  resource_group: docker-push-$CI_REGISTRY_IMAGE
  script:
    - docker version
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:1.0"
        docker push "$CI_REGISTRY_IMAGE:1.0"
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
