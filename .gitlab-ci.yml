stages:
  - test
  - build

go-test:
  stage: test
  image: golang:1.25
  script:
    - go version
    - go mod download
    - go test ./...

go-build:
  stage: build
  image: golang:1.27.1
  script:
    - go mod download
    - go build -o devops-shop ./cmd/api
  artifacts:
    paths:
      - devops-shop
